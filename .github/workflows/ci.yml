name: CI
on:
  push:
    branches: [main]
  pull_request:

# a newer push to a pull request replaces the running checks
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"

      - name: Pre Commit
        run: uvx pre-commit run --all-files

      - name: Check that the config files are valid JSON
        run: jq empty config/rulesets/*.json

  # one check to require on main, so changing the jobs needs no settings change
  ci-ok:
    name: CI ok
    needs: [lint]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check that all jobs succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "not all jobs succeeded: $RESULTS"
              exit 1
            fi
          done
